  encoding_channels:
  - shape
  - value
orientation:
  id: null
family:
  canonical_parent: null
  derivation_role: canonical_parent
  shared_geometry_group: GEO-GATE-FRAME
  shared_anchor_group: ANCHORGRP-GATE
  must_preserve:
  - outer_frame_geometry
  - frame_thickness
  - top_down_projection
  - palette_family
  - footprint
  must_change: []
  may_vary:
  - bolt_row_count
  must_not_introduce:
  - new_ornament
  - directional_shading
production:
  strategy: generated_raster
  derivation_mode: independent
  strategy_rationale: 'canonical parent: full frame plus full panel exposes every
    identity-bearing feature. runtime_primitive was rejected because NEG-TEXTURE-002
    requires authored value grain that a flat fill cannot produce.'
normalization:
  canvas_policy: fixed
  scale_policy: family_shared
  anchor_policy: content_bottom_center
  pivot_policy: bottom_center
  target_canvas:
    width: 256
    height: 256
  padding: 8
  trim: true
  resample: lanczos
runtime:
  footprint: 1x1 tile
  intended_display_size:
    width: 64
    height: 64
  readability_requirements:
  - frame silhouette recognizable at 64 px
  state_readability_requirements:
  - panel height difference decodable at 64 px against both declared backgrounds
  backgrounds_encountered:
  - '#1B1F24'
  - '#3A4149'
accessibility:
  gameplay_critical: true
  required_checks:
  - A11Y_CONTRAST
  - A11Y_COLOR_VISION
  - A11Y_NON_COLOR_CHANNEL
qc_requirements:
- compare all three states side by side at 64 px
- verify colour-vision separation against siblings
dependencies:
  upstream:
  - spec/game-spec.yaml
  - art/art-style.yaml
  downstream_hints: []
