accessibility:
  gameplay_critical: true
  required_checks:
  - A11Y_CONTRAST
  - A11Y_COLOR_VISION
  - A11Y_NON_COLOR_CHANNEL
asset_id: AST-GATE-OPENING-002
category: interactive_object
dependencies:
  downstream_hints: []
  upstream:
  - spec/game-spec.yaml
  - art/art-style.yaml
family:
  canonical_parent: AST-GATE-OPENING-000
  derivation_role: derivative
  shared_geometry_group: GEO-GATE-FRAME
  shared_anchor_group: ANCHORGRP-GATE
  must_preserve:
  - outer_frame_geometry
  - frame_thickness
  - top_down_projection
  - palette_family
  - footprint
  - runtime_pivot
  must_change:
  - panel_height
  may_vary:
  - bolt_row_count
  must_not_introduce:
  - new_ornament
  - directional_shading
  - per_frame_grain_reseed
family_id: FAM-GATE-OPENING
normalization:
  anchor_policy: content_bottom_center
  canvas_policy: fixed
  padding: 8
  pivot_policy: bottom_center
  resample: lanczos
  scale_policy: family_shared
  target_canvas:
    height: 256
    width: 256
  trim: true
orientation:
  id: null
priority: P1
production:
  derivation_mode: parent_derived
  strategy: generated_raster
  strategy_rationale: frames are poses of one drawing, so each derives from frame
    0 rather than being generated independently; an independently generated in-between
    is a redraw and check_frames.py reports it as IDENTITY_DRIFT.
purpose: opening animation, frame 2 of 4
qc_requirements:
- run check_frames.py over the whole clip before judging any single frame
- verify runtime_pivot is identical across all frames
runtime:
  backgrounds_encountered:
  - '#1B1F24'
  - '#3A4149'
  footprint: 1x1 tile
  intended_display_size:
    height: 64
    width: 64
  readability_requirements:
  - panel travel readable at 64 px at 12 fps
  state_readability_requirements:
  - the clip reads as one gate moving, not as four different gates
schema_version: 3
source_versions:
  game_spec:
    path: spec/game-spec.yaml
    version: v1
    content_hash: 27cbc927c75d77294df970b9a63de1dfa3444f9e9a12ae6239009854899a624a
