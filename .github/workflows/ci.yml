name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python validator dependency
        run: python -m pip install pyyaml
      - name: Toolkit doctor
        run: python scripts/doctor.py .
      - name: Semantic contract validator
        run: python scripts/validate_contracts.py
      - name: CLI smoke test
        run: npm run check
      - name: Package contents check
        run: npm run pack:check
