version: 3

project:
  id: null
  name: null

# lite  - fewer artifacts, ceiling QC_APPROVED, engine integration and runtime
#         validation optional. Good for jams, prototypes, small asset sets.
# full  - every stage, full lineage discipline, ceiling SHIPPABLE.
# See contracts/profiles/ for what each relaxes and what it never relaxes.
profile: full

# Engine target. Required by the engine_integration stage.
engine:
  id: default
  target: web-canvas        # unity | unreal | godot | web-canvas | web-dom | custom
  pixels_per_unit: 100
  color_space: gamma

# Performance budgets, measured by
# skills/game-engine-integrator/scripts/budget_check.py.
# An undeclared budget is not a passing budget - it reports
# INSUFFICIENT_EVIDENCE, and an entirely undeclared set blocks integration.
budgets:
  max_atlas_dimension: 2048
  max_texture_memory_mb: 64
  max_total_asset_bytes: 12000000
  max_single_asset_bytes: 512000

# Accessibility baseline declared by GameSpec PRODUCTION_READY and verified by
# game-asset-qc and runtime-visual-validator. A baseline no stage checks is a
# contract hole; delete this block only with an explicit recorded decision.
accessibility:
  min_contrast_ratio: 3.0
  color_vision_modes: [protanopia, deuteranopia, tritanopia]
  require_non_color_channel: true

# Canonical logical-artifact -> project-path registry.
# EVERY stage resolves logical artifact names through this map when this file
# exists, including game_spec and art_style. Writing to a repository-root
# filename when the registry maps it elsewhere breaks the pipeline silently.
paths:
  game_spec: spec/game-spec.yaml
  game_spec_human: spec/GameSpec.md
  requirement_state: spec/requirement-state.yaml
  game_spec_decision_log: spec/decision-log.md

  art_style: art/art-style.yaml
  art_style_human: art/ArtStyle.md
  style_requirement_state: art/style-requirement-state.yaml
  style_decision_log: art/style-decision-log.md
  style_anchors: art/style-anchor-manifest.yaml
  calibration_plan: art/calibration-plan.yaml
  reference_corpus: art/reference-corpus.yaml
  reference_search_history: art/reference-search-history.yaml
  style_constraint_ledger: art/style-constraint-ledger.yaml
  style_loop_state: art/style-loop-state.yaml

  asset_manifest: assets/asset-manifest.yaml
  asset_specs: assets/specs/

  generation: generation/
  normalized: normalized/
  qc: qc/
  engine_integration: engine-integration/
  runtime_validation: runtime-validation/

  # Superseded artifacts are archived here before being overwritten, which is
  # what makes append-only provenance true. Optional: omit it and archiving is
  # simply not used. See contracts/toolkit-contract.yaml -> retention.
  history: .pipeline/history/

  pipeline_state: .pipeline/game-art-production-state.yaml
  handoffs: .pipeline/handoffs/
  invalidation_ledger: .pipeline/invalidation-ledger.yaml
  rework_queue: .pipeline/rework-queue.yaml

path_resolution:
  mode: canonical_registry
  logical_patterns_in_skill_docs: true
  rule: when project.yaml exists, paths in this registry override repository-root examples in skill documentation
