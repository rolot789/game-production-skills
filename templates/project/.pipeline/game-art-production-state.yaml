# Asset entries track lifecycle plus the exact active lineage:
#
#   assets:
#     AST-GATE-CLOSED:
#       lifecycle: QC_APPROVED
#       family_id: FAM-GATE
#       priority: P0
#       active_versions:
#         asset_spec:           { version: v1, content_hash: <sha256> }
#         generation_candidate: { id: v1-c1,   content_hash: <sha256> }
#         normalization_output: { version: v1, content_hash: <sha256> }
#         qc_report:            { version: v1, content_hash: <sha256> }
#       root_owner: null
