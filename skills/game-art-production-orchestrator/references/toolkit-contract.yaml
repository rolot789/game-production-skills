  - G2_REDERIVE_FROM_CANONICAL_PARENT
  - G3_CHANGE_GENERATION_STRATEGY
  - G4_ESCALATE_UPSTREAM

# ---------------------------------------------------------------------------
# Lineage: version and hash rules.
#
# Dependency-aware invalidation is only executable if identity is computable.
# These fields are REQUIRED, not "when available". A stage that cannot produce
# them must block rather than emit an unverifiable record.
# ---------------------------------------------------------------------------
lineage:
  version_format:
    pattern: '^v[0-9]+$'
    scope: monotonic per artifact path
    owner: the stage that writes the artifact increments it
    rule: a stage increments the version of an artifact it writes whenever the
      serialized content changes; readers never increment.
  candidate_version_format:
    pattern: '^v[0-9]+-c[0-9]+$'
    rule: generation candidates carry the job version plus a candidate ordinal.
  content_hash:
    algorithm: sha256
    encoding: lowercase hex, full digest
    scope_for_binary_artifacts: the exact bytes of the file
    scope_for_yaml_artifacts: the UTF-8 bytes of the serialized file as written to disk
    field_name: content_hash
    rule: a record that claims an input MUST carry that input's content_hash.
  equivalence_rule: >-
    Effective input equivalence is proven only by identical content_hash for
    every declared authoritative input plus an identical policy version.
    Visual similarity, file size, and timestamps never prove equivalence.
  unavailable_policy: >-
    If a required version or content_hash cannot be produced, the stage emits a
    BLOCKER and stops. `unknown` is not an acceptable lineage value in any
    record that a downstream promotion depends on.

# ---------------------------------------------------------------------------
# Generation budget. Symmetric with the reference search budget so the
# expensive side of the pipeline is bounded too.
# ---------------------------------------------------------------------------
generation_budget:
  candidates_per_job:
    default_max: 4
    rule: stop as soon as one candidate passes screening on every critical dimension
  regeneration_attempts_per_asset:
    default_max: 6
    rule: counted across all G-levels for one asset within one rework transaction
  same_level_repeats:
    G0_SAME_CONTRACT_RETRY: 2
    rule: a third identical-contract retry is evidence that the contract, not the
      sampler, is wrong; escalate instead of repeating
  escalation_rule: >-
    Two consecutive failures on the same dimension at one level must escalate to
    the next level rather than repeat. Exhausting the attempt budget escalates to
    G4_ESCALATE_UPSTREAM and stops.
  stop_conditions:
    - a candidate satisfies the production contract
    - the attempt budget is exhausted
    - the failure class is UPSTREAM_SPEC_AMBIGUITY
    - repeated failure indicates provider/topology inadequacy and no strategy remains

# ---------------------------------------------------------------------------
# Rework budget. `generation_budget` bounds the edge that costs image budget;
# this bounds every other routing edge, which costs nothing per attempt and so
# has no natural stopping point.
#
# The failure this exists to stop: two stages disagree about a verdict for
# identical bytes, the routing table sends the subject to the stage that
# produced those bytes, and it reproduces them. Nothing in the loop changes,
# and nothing in the loop notices.
# ---------------------------------------------------------------------------
rework_budget:
  same_route_repeats:
    default_max: 2
    rule: >-
      Routing one subject to the same root owner for the same reason_code a
      third time is evidence that two stages disagree about the contract, not
      that the fix was applied badly.
  progress_rule: >-
    An attempt counts as progress only when the receiving stage produced an
    output whose content_hash differs from the previous attempt's. An identical
    output is a repeat regardless of how the receiver described its work.
  escalation_rule: >-
    On exhausting same_route_repeats, stop and emit a BLOCKER naming both
    stages, the disputed check, and the subject. Two stages that cannot agree
    on a verdict for identical bytes is a contract defect; neither stage owns
    it, so neither may be sent the ticket again.
  stop_conditions:
    - the receiving stage produced an output with a new content_hash
    - same_route_repeats is exhausted for one subject and reason_code
  recorded_in: .pipeline/game-art-production-state.yaml -> assets.<id>.rework_attempts

accessibility:
  required_checks:
    - id: A11Y_CONTRAST
      stage: asset_qc
      rule: state-bearing and text-bearing elements meet the project contrast floor at intended runtime size
    - id: A11Y_COLOR_VISION
      stage: asset_qc
      rule: gameplay state distinctions survive protanopia, deuteranopia, and tritanopia simulation
    - id: A11Y_NON_COLOR_CHANNEL
      stage: asset_qc
      rule: any gameplay-critical distinction encoded in hue also uses a second channel (value, shape, icon, or motion)
    - id: A11Y_RUNTIME_CONTRAST
      stage: runtime_validation
      rule: contrast and state distinction hold against the actual scene background, not a transparent canvas
  gate_binding: >-
    GameSpec PRODUCTION_READY declares an accessibility baseline. These checks
    are how downstream stages verify it. A declared baseline with no downstream
    check is a contract hole.

lineage_rules:
  - A changed generation candidate invalidates descendant normalization, QC, engine integration, and dependent runtime approval unless exact effective input equivalence is proven by content_hash.
  - A changed normalized output invalidates descendant QC, engine integration, and dependent runtime approval.
  - A changed atlas or import-setting output invalidates dependent runtime approval only.
  - Runtime-integration-only changes may preserve generation, normalization, QC, and engine integration when their authoritative inputs remain unchanged.
  - A discovered reference added to the corpus does not invalidate production unless locked style truth or approved scoped authority changes.

principles:
  - Locked upstream artifacts are immutable until explicitly revised.
  - Inferred decisions are never equivalent to confirmed decisions.
  - Do not bypass readiness gates by guessing downstream requirements.
  - Assets are specification + references + provenance + runtime metadata + QC, not files alone.
  - Invalidate only dependency-affected descendants when upstream sources change.
  - Runtime approval is distinct from isolated asset QC approval.
  - Search-derived references become production authorities only through explicit scoped approval.
  - Regeneration preserves passing dimensions and changes only the smallest failing surface whenever possible.
  - Asset QC evaluates explicit production contracts and routes failures to root owners without redesigning or modifying assets.
  - Runtime validation evaluates real rendered contexts and does not substitute partial capture review for executable runtime approval.
  - Symptom location, root ownership, invalidation scope, and revalidation scope are separate decisions.
  - SHIPPABLE promotion requires coherent active versions across every stage the active profile requires.
  - External rework handoffs use canonical change_scope and preserve_scope fields.
  - Deterministic work runs in the stage's declared tool; agent judgment reads the tool output rather than replacing it.
  - Identity is computed, not asserted. A lineage claim without a content_hash is not a lineage claim.
