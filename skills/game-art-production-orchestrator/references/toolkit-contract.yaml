# Shared vocabulary for any per-dimension verification result, used by QC,
# engine integration, runtime validation, and the artifact schemas.
# INSUFFICIENT_EVIDENCE is never a pass: when the unresolved evidence is
# production-critical, the stage status becomes blocked.
verification_results:
  - PASS
  - FAIL
  - NOT_APPLICABLE
  - INSUFFICIENT_EVIDENCE
  - CONTRACT_CONFLICT

