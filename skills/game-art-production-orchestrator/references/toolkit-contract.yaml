# ---------------------------------------------------------------------------
# Legal asset lifecycle transitions.
#
# The orchestrator MUST reject any transition that is not listed here. A state
# with an empty `to` list is terminal for the current lineage.
#
# `condition` names the evidence that authorizes the transition. Absent that
# evidence the transition is illegal even if the target state is listed.
# ---------------------------------------------------------------------------
lifecycle_transitions:
  PLANNED:
    - to: READY_FOR_GENERATION
      condition: AssetSpec complete and required upstream gates passed
    - to: INVALIDATED
      condition: upstream authority changed
  READY_FOR_GENERATION:
    - to: GENERATED
      condition: selected candidate exists with truthful provenance
    - to: GENERATION_REWORK
      condition: generation screening rejected every candidate
    - to: INVALIDATED
      condition: upstream authority changed
  GENERATED:
    - to: NORMALIZED
      condition: normalization record binds the exact candidate content_hash
    - to: NORMALIZATION_BLOCKED
      condition: candidate identity or policy cannot be resolved
    - to: GENERATION_REWORK
      condition: post-selection defect attributed to generation
    - to: INVALIDATED
      condition: upstream authority changed
  NORMALIZED:
    - to: QC_APPROVED
      condition: qc-report status in stages.asset_qc.promotion_status for this exact output_hash
    - to: QC_REWORK
      condition: qc-report status rework_required
    - to: NORMALIZATION_BLOCKED
      condition: qc-report status blocked with normalizer root owner
    - to: GENERATION_REWORK
      condition: qc-report routes root ownership to generation
    - to: INVALIDATED
      condition: upstream authority changed
  QC_APPROVED:
    - to: INTEGRATION_READY
      condition: budget-report status in stages.engine_integration.promotion_status
    - to: INTEGRATION_REWORK
      condition: engine integration reports integration_rework_required
    - to: RUNTIME_APPROVED
      condition: runtime report promotes AND profile does not require engine_integration
    - to: RUNTIME_REWORK
      condition: runtime report requires rework
    - to: INVALIDATED
      condition: upstream authority changed
  INTEGRATION_READY:
    - to: RUNTIME_APPROVED
      condition: runtime report status in stages.runtime_validation.promotion_status for this lineage
    - to: RUNTIME_REWORK
      condition: runtime report requires rework
    - to: INTEGRATION_REWORK
      condition: budget or import-setting defect found downstream
    - to: INVALIDATED
      condition: upstream authority changed
  RUNTIME_APPROVED:
    - to: SHIPPABLE
      condition: coherent active lineage across every stage the active profile requires
    - to: RUNTIME_REWORK
      condition: regression found in a previously approved context
    - to: INVALIDATED
      condition: upstream authority changed
  SHIPPABLE:
    - to: INVALIDATED
      condition: upstream authority changed
    - to: RUNTIME_REWORK
      condition: regression found after shipping decision
  GENERATION_REWORK:
    - to: GENERATED
      condition: new candidate satisfies change_scope without violating preserve_scope
    - to: READY_FOR_GENERATION
      condition: rework escalated and generation contract recompiled
    - to: INVALIDATED
      condition: rework escalated upstream and the AssetSpec changed
  NORMALIZATION_BLOCKED:
    - to: NORMALIZED
      condition: blocking input resolved and normalization completed
    - to: GENERATION_REWORK
      condition: block root-owned by generation
    - to: PLANNED
      condition: block root-owned by planner and the AssetSpec was revised
    - to: INVALIDATED
      condition: upstream authority changed
  QC_REWORK:
    - to: NORMALIZED
      condition: normalizer-owned fix produced a new normalized output
    - to: GENERATION_REWORK
      condition: QC routed root ownership to generation
    - to: PLANNED
      condition: QC routed root ownership to planner
    - to: INVALIDATED
      condition: upstream authority changed
  INTEGRATION_REWORK:
    - to: INTEGRATION_READY
      condition: integration fix passes the budget report
    - to: NORMALIZED
      condition: integration routed root ownership to the normalizer
    - to: PLANNED
      condition: integration routed root ownership to the planner
    - to: INVALIDATED
      condition: upstream authority changed
  RUNTIME_REWORK:
    - to: RUNTIME_APPROVED
      condition: revalidation of affected contexts passes for the same lineage
    - to: INTEGRATION_REWORK
      condition: runtime routed root ownership to engine integration
    - to: NORMALIZED
      condition: runtime routed root ownership to the normalizer
    - to: GENERATION_REWORK
      condition: runtime routed root ownership to generation
    - to: PLANNED
      condition: runtime routed root ownership to the planner
    - to: INVALIDATED
      condition: runtime routed root ownership to art-style or game-spec
  INVALIDATED:
    - to: PLANNED
      condition: AssetSpec re-derived from revised upstream authority

