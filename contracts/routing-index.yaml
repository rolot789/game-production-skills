version: 3
name: failure-routing-index

decision_procedure:
  - 1. Is the expected player-visible behavior defined and internally consistent?
    if_no: SEMANTIC_UNDEFINED or STYLE_AUTHORITY_CONFLICT or DECOMPOSITION_DEFECT by requirement type
  - 2. Did the defect exist in the generated candidate before normalization?
    if_yes: a game-asset-generator class
  - 3. Was the candidate correct and processing introduced the defect?
    if_yes: a game-asset-normalizer class
  - 4. Was the normalized asset correct and engine packaging introduced the defect?
    if_yes: a game-engine-integrator class
  - 5. Does the same asset work correctly in another valid runtime context?
    if_yes: INTEGRATION_LOCAL
  - 6. Does the failure correlate with a shared runtime rule across contexts?
    if_yes: INTEGRATION_SYSTEMIC
  - 7. Would fixing runtime integration require violating locked asset or style behavior?
    if_yes: CONTEXT_SENSITIVE_ASSET_FAILURE
  - 8. Is the requirement now rejected by the user rather than incorrectly implemented?
    if_yes: STYLE_AUTHORITY_CONFLICT or SEMANTIC_UNDEFINED; never blame the generator

