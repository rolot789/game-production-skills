version: 3
name: contract-mirror-manifest

# ---------------------------------------------------------------------------
# Why this exists
#
# A skill is installed as a self-contained directory (`.agents/skills/<name>/`).
# Anything a SKILL.md tells the agent to read must therefore resolve *inside*
# that directory. Before this manifest, four SKILL.md files pointed at
# `contracts/rework-handoff-contract.yaml`, which does not exist in any
# installed project - the installer only ever copied `skills/`.
#
# The repository keeps `contracts/` as the single editable source. This
# manifest declares which contract files are mirrored into which skill, and
# `scripts/sync_contracts.py` performs the copy. CI runs it with `--check`, so
# an edited contract that was not re-synced fails the build instead of shipping
# a stale copy.
#
# Never hand-edit a mirrored file under `skills/*/references/`. Edit the source
# under `contracts/` and run `python3 scripts/sync_contracts.py`.
# ---------------------------------------------------------------------------

mirror_root: references
header_marker: "# GENERATED MIRROR - DO NOT EDIT"

mirrors:
  - source: contracts/rework-handoff-contract.yaml
    reason: every skill that emits or consumes an external rework handoff must be able to read the canonical envelope
    targets:
      - game-asset-planner
      - game-asset-generator
      - game-asset-normalizer
      - game-asset-qc
      - game-engine-integrator
      - runtime-visual-validator
      - game-art-production-orchestrator

  - source: contracts/routing.yaml
    reason: every skill that assigns a root owner or receives a routed handoff must read the same routing table
    targets:
      - game-asset-planner
      - game-asset-generator
      - game-asset-normalizer
      - game-asset-qc
      - game-engine-integrator
      - runtime-visual-validator
      - game-art-production-orchestrator

  - source: contracts/providers.yaml
    reason: >-
      the generator checks a planned asset set against the declared provider
      before spending image budget; the planner and orchestrator need the same
      capability table to know whether a derivation_mode is achievable
    targets:
      - game-asset-planner
      - game-asset-generator
      - game-art-production-orchestrator

  - source: contracts/routing-index.yaml
    reason: >-
      the compact lookup is the default read; the full routing.yaml is 279 lines
      and seven skills were each told to read all of it to resolve one row
    targets:
      - game-asset-planner
      - game-asset-generator
      - game-asset-normalizer
      - game-asset-qc
      - game-engine-integrator
      - runtime-visual-validator
      - game-art-production-orchestrator

  - source: contracts/toolkit-contract.yaml
    reason: the orchestrator enforces stage order, enums, lifecycle transitions, lineage, and budgets
    targets:
      - game-art-production-orchestrator

# Whole-directory mirrors, for when a skill needs a family of files. Mirrored
# into references/<into>/ so the skill's own reference documents stay readable.
#
# JSON schemas are mirrored byte-identically - JSON has no comment syntax, so
# the generated-mirror header cannot be embedded. This manifest is the record
# that they are generated; never hand-edit them either.
# Per-skill schema mirrors.
#
# Every skill used to carry all 11 schemas - 42 KB, roughly 10,000 tokens - while
# naming exactly one. An agent that globs `references/` paid for ten schemas it
# had no use for.
#
# A skill gets the schemas for the artifacts it WRITES, plus the handoff
# envelope when it routes rework, plus `_defs.json`, which every other schema
# $refs. Reading an upstream artifact does not require its schema; validating
# your own output does.
#
# validate_contracts.py checks that every schema a skill's documents name is in
# its list here, so the two cannot drift apart.
schema_mirrors:
  into: schemas
  source_dir: contracts/schemas
  always:
    - _defs.json          # $ref'd by every other schema
  targets:
    game-asset-planner:
      - asset-spec.schema.json
      - asset-manifest.schema.json
      - rework-handoff.schema.json
    game-asset-generator:
      - generation-record.schema.json
      - rework-handoff.schema.json
    game-asset-normalizer:
      - normalization-record.schema.json
      - rework-handoff.schema.json
    game-asset-qc:
      - qc-report.schema.json
      - rework-handoff.schema.json
    game-engine-integrator:
      - budget-report.schema.json
      - atlas-manifest.schema.json
      - rework-handoff.schema.json
    runtime-visual-validator:
      - runtime-report.schema.json
      - rework-handoff.schema.json
    game-art-production-orchestrator:
      - pipeline-state.schema.json
      - project.schema.json
      - rework-handoff.schema.json
